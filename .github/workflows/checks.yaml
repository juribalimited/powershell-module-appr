name: Checks

on:
  pull_request:
    branches:
      - main

jobs:
  scriptanalyzer:
    runs-on: ubuntu-latest
    name: 'PowerShell Script Analyzer'
    steps:
      - uses: actions/checkout@v6
      - name: 'Install PSScriptAnalyzer PowerShell module'
        run: Install-Module PSScriptAnalyzer -Force
        shell: pwsh
      # Gate CI on Error-severity findings only. Warnings are surfaced during
      # local development but don't block PRs — they'll be cleaned up in
      # follow-up PRs without blocking unrelated work.
      - name: 'Run PSScriptAnalyzer — module code'
        run: Invoke-ScriptAnalyzer -Path ./Juriba.AppR/Public -Recurse -Severity Error -EnableExit -ExcludeRule PSAvoidTrailingWhitespace | Format-List -Property ScriptName, RuleName, Severity, Line, Column, Message
        shell: pwsh
      - name: 'Run PSScriptAnalyzer — examples'
        run: Invoke-ScriptAnalyzer -Path ./Juriba.AppR/Examples -Recurse -Severity Error -EnableExit -ExcludeRule PSAvoidTrailingWhitespace | Format-List -Property ScriptName, RuleName, Severity, Line, Column, Message
        shell: pwsh
