name: Checks

on:
  pull_request:
    branches:
      - main

jobs:
  scriptanalyzer:
    runs-on: ubuntu-latest
    name: 'PowerShell Script Analyzer'
    steps:
      - uses: actions/checkout@v7
      - name: 'Install PSScriptAnalyzer PowerShell module'
        run: Install-Module PSScriptAnalyzer -Force
        shell: pwsh
      - name: 'Run PSScriptAnalyzer'
        run: Invoke-ScriptAnalyzer -Path ./Juriba.AppR -Recurse -EnableExit -ExcludeRule PSAvoidTrailingWhitespace | Format-List -Property ScriptName, RuleName, Severity, Line, Column, Message
        shell: pwsh
